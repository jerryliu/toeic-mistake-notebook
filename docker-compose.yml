services:
  mysql:
    image: mysql:8.4
    container_name: toeic-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-toeic_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-toeic}
      MYSQL_USER: ${MYSQL_USER:-toeic}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-toeic_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - toeic_mysql_data:/var/lib/mysql
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-toeic_root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: toeic-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - toeic_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  toeic_mysql_data:
  toeic_redis_data:
